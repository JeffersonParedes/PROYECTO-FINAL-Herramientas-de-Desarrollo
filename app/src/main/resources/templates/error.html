<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - Nexo Foro</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    
    <style>
        :root {
            --fh-bg:           #0f1117;
            --fh-surface:      #1a1d27;
            --fh-border:       #2e3248;
            --fh-accent:       #6c63ff;
            --fh-text:         #e2e5f0;
            --fh-muted:        #8b8fa8;
        }
        body {
            background-color: var(--fh-bg);
            color: var(--fh-text);
            font-family: 'DM Sans', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .error-card {
            background: var(--fh-surface);
            border: 1px solid var(--fh-border);
            border-radius: 16px;
            max-width: 500px;
            width: 100%;
            padding: 2.5rem;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .error-icon {
            font-size: 4rem;
            color: #ef4444;
            margin-bottom: 1rem;
        }
        .error-title {
            font-family: 'Sora', sans-serif;
            font-weight: 700;
            margin-bottom: 1rem;
        }
        .error-message {
            color: var(--fh-muted);
            margin-bottom: 2rem;
            font-size: 1.05rem;
            line-height: 1.6;
        }
        .btn-home {
            background: var(--fh-accent);
            border: none;
            color: #fff;
            padding: 0.75rem 2rem;
            border-radius: 8px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .btn-home:hover {
            opacity: 0.9;
            color: #fff;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="error-card">
        <div class="error-icon">
            <i class="bi bi-exclamation-triangle-fill"></i>
        </div>
        <h2 class="error-title" th:text="'Error ' + ${status != null ? status : '500'}">Error 500</h2>
        <p class="error-message" th:text="${mensaje != null ? mensaje : 'Ha ocurrido un error inesperado en el servidor.'}">
            Ha ocurrido un error inesperado en el servidor.
        </p>
        <a th:href="@{/index}" class="btn-home">
            <i class="bi bi-house-door"></i> Volver al Inicio
        </a>
    </div>

</body>
</html>
