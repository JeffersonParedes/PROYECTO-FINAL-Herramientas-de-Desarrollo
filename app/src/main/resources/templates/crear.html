<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<!-- HEAD desde base -->
<head th:replace="base :: head('Crear Publicación | Nexo Foro')"></head>

<body>

<!-- NAVBAR desde base -->
<nav th:replace="base :: navbar"></nav>

<div class="fh-layout">

    <!-- SIDEBAR desde base -->
    <aside th:replace="base :: sidebar"></aside>

    <!-- MAIN -->
    <main class="fh-main">

        <h2 class="mb-4">Crear Publicación</h2>

        <div th:if="${error}" class="alert alert-danger mb-3" style="background: rgba(239,68,68,.15); color: #f87171; border: 1px solid rgba(239,68,68,.3);" th:text="${error}">
            Error
        </div>

        <div class="card p-4" style="background:#1a1d27; border:1px solid #2e3248; border-radius:12px;">

            <form th:action="@{/publicacion/crear}" method="post" enctype="multipart/form-data">

                <!-- Título -->
                <div class="mb-3">
                    <label class="form-label text-light fw-bold">Título *</label>
                    <input type="text" name="titulo" class="form-control fh-form-control" style="background: #22263a; border: 1px solid #2e3248; color: #fff;" required>
                </div>

                <!-- Subforo -->
                <div class="mb-3">
                    <label class="form-label text-light fw-bold">Subforo *</label>
                    <select name="subforoId" class="form-select" style="background: #22263a; border: 1px solid #2e3248; color: #fff;" required>
                        <option value="" th:if="${#lists.isEmpty(subforos)}" selected disabled>No hay subforos disponibles</option>
                        <option value="" th:if="${!#lists.isEmpty(subforos)}" selected disabled>Selecciona un subforo</option>
                        <option th:each="sub : ${subforos}"
                                th:value="${sub.id}"
                                th:text="${sub.nombre}"
                                th:selected="${param.subforoId != null && param.subforoId[0] == #strings.toString(sub.id)}">
                        </option>
                    </select>
                    <div th:if="${#lists.isEmpty(subforos)}" class="text-warning mt-2" style="font-size: 0.9rem;">
                        No hay subforos registrados. Crea uno primero desde administración.
                    </div>
                </div>

                <!-- Descripción Breve (opcional) -->
                <div class="mb-3">
                    <label class="form-label text-light fw-bold">Descripción Corta <span class="text-muted">(Opcional)</span></label>
                    <input type="text" name="descripcion" class="form-control" style="background: #22263a; border: 1px solid #2e3248; color: #fff;" placeholder="Un breve resumen de la publicación...">
                </div>

                <!-- Contenido -->
                <div class="mb-3">
                    <label class="form-label text-light fw-bold">Contenido *</label>
                    <textarea name="contenido" rows="5" class="form-control" style="background: #22263a; border: 1px solid #2e3248; color: #fff;" placeholder="Escribe el cuerpo de tu publicación..." required></textarea>
                </div>

                <!-- Subida Multimedia -->
                <div class="row mb-4">
                    <div class="col-md-4">
                        <label class="form-label text-light fw-bold">Subir Imagen <span class="text-muted">(png, jpg, gif, webp)</span></label>
                        <input type="file" name="imagenFile" accept=".png,.jpg,.jpeg,.gif,.webp" class="form-control" style="background: #22263a; border: 1px solid #2e3248; color: #fff;">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label text-light fw-bold">Subir Video <span class="text-muted">(mp4, webm, avi, mov)</span></label>
                        <input type="file" name="videoFile" accept=".mp4,.webm,.avi,.mov" class="form-control" style="background: #22263a; border: 1px solid #2e3248; color: #fff;">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label text-light fw-bold">Subir Audio <span class="text-muted">(mp3, wav, ogg, aac)</span></label>
                        <input type="file" name="audioFile" accept=".mp3,.wav,.ogg,.aac" class="form-control" style="background: #22263a; border: 1px solid #2e3248; color: #fff;">
                    </div>
                </div>
    
                <!-- Botón -->
                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold" th:disabled="${#lists.isEmpty(subforos)}" style="background: var(--fh-accent); border: none;">
                    <i class="bi bi-send me-1"></i> Publicar
                </button>

            </form>

        </div>

    </main>
</div><!-- /fh-layout -->

<!-- SCRIPTS desde base -->
<div th:replace="base :: scripts"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
