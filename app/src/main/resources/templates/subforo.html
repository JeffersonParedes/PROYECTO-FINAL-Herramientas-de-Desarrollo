<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
 
<!-- HEAD desde base -->
<head th:replace="base :: head(${subforo.nombre} + ' | Nexo Foro')"></head>
 
<body>
 
<!-- NAVBAR desde base -->
<nav th:replace="base :: navbar"></nav>
 
<div class="fh-layout">
 
    <!-- SIDEBAR desde base -->
    <aside th:replace="base :: sidebar"></aside>
 
    <!-- MAIN -->
    <main class="fh-main">
 
        <!-- ══════════════ CABECERA SUBFORO ══════════════ -->
        <div class="subforo-header">
            <div class="d-flex align-items-start gap-3 flex-wrap">
                <div class="subforo-icon">
                    <i class="bi bi-folder-fill"></i>
                </div>
 
                <div>
                    <h1 class="subforo-name" th:text="${subforo.nombre}">Subforo</h1>
                    <p class="subforo-desc" th:text="${subforo.descripcion}">
                        Descripción...
                    </p>
                </div>
            </div>
        </div>
 
        <!-- Breadcrumbs -->
        <div class="mb-4 d-flex align-items-center gap-2 flex-wrap" style="background: var(--fh-surface); padding: 10px 15px; border-radius: 8px; border: 1px solid var(--fh-border);">
            <small class="text-muted">Ruta:</small>
            <th:block th:each="crumb, iter : ${breadcrumbs}">
                <a th:href="@{/subforo/{id}(id=${crumb.id})}" class="badge-subforo" th:text="${crumb.nombre}">Subforo</a>
                <span th:if="${!iter.last}" class="text-muted">/</span>
            </th:block>
        </div>
 
        <!-- CONTENIDO VISIBLE -->
        <div id="contenido-subforo">
 
            <!-- Action bar -->
            <div class="action-bar mb-4">
                <div class="sort-tabs">
                    <span class="text-muted" style="font-size:0.9rem;">Publicaciones en esta categoría</span>
                </div>
                <div>
                    <a th:href="@{/crear(subforoId=${subforo.id})}" class="btn-crear">
                        <i class="bi bi-pencil-square"></i> Crear Publicación
                    </a>
                </div>
            </div>
 
            <!-- Tarjetas dinámicas -->
            <div th:each="pub : ${publicaciones}" class="fh-card">
                <div class="score-col">
                    <span class="score-val" 
                          th:classappend="${pub.puntuacion > 0} ? 'pos' : (${pub.puntuacion < 0} ? 'neg' : 'neu')" 
                          th:text="${pub.puntuacion > 0} ? '+' + ${pub.puntuacion} : ${pub.puntuacion}">0</span>
                    <span class="score-lbl">pts</span>
                </div>
                <div class="card-body-inner">
                    <div class="card-title">
                        <a th:href="@{/publicacion/{id}(id=${pub.id})}" th:text="${pub.titulo}">Título</a>
                    </div>
                    <p class="card-excerpt" th:text="${pub.descripcion}">
                        Descripción corta...
                    </p>
                    <div class="card-foot">
                        <span class="meta-pill"><i class="bi bi-person-circle"></i> <a th:href="@{/perfil/{nick}(nick=${pub.autorNickname})}" th:text="${pub.autorNickname}">Autor</a></span>
                        <span class="meta-pill"><i class="bi bi-clock"></i> <span th:text="${#temporals.format(pub.fechaCreacion, 'dd MMM yyyy HH:mm')}">Fecha</span></span>
                    </div>
                </div>
            </div>
            <div th:if="${#lists.isEmpty(publicaciones)}" class="text-center py-5 text-muted">
                <i class="bi bi-chat-left-dots" style="font-size: 3rem;"></i>
                <p class="mt-3">Aún no hay publicaciones en este subforo. ¡Sé el primero en publicar!</p>
            </div>
 
        </div><!-- /contenido-subforo -->
 
    </main>
</div>
 
<!-- SCRIPTS desde base -->
<th:block th:replace="base :: scripts"></th:block>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
 
</body>
</html>
