<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<!-- HEAD desde base -->
<head th:replace="base :: head('Inicio | Nexo Foro')"></head>

<body>

<!-- NAVBAR desde base -->
<nav th:replace="base :: navbar"></nav>

<div class="fh-layout">

    <!-- SIDEBAR desde base -->
    <aside th:replace="base :: sidebar"></aside>

    <!-- MAIN -->
    <main class="fh-main">

        <!-- Hero -->
        <div class="fh-hero">
            <h1>Bienvenido a <span>Nexo Foro</span></h1>
            <div class="fh-hero-actions">
                <a th:href="@{/registro}" th:unless="${usuarioLogueado}" class="btn-register">
                    <i class="bi bi-person-plus me-1"></i>Únete ahora
                </a>
                <a th:href="@{/crear}" th:if="${usuarioLogueado}" class="btn-register">
                    <i class="bi bi-pencil-square me-1"></i>Crear Publicación
                </a>
                <a href="#feed" class="btn-login">
                    <i class="bi bi-arrow-down me-1"></i>Ver publicaciones
                </a>
            </div>
        </div>

        <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show" role="alert" style="background: rgba(74,222,128,.15); color: #4ade80; border: 1px solid rgba(74,222,128,.3);">
            <span th:text="${mensaje}">Mensaje</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close" style="filter: invert(1);"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert" style="background: rgba(239,68,68,.15); color: #f87171; border: 1px solid rgba(239,68,68,.3);">
            <span th:text="${error}">Error</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close" style="filter: invert(1);"></button>
        </div>

        <!-- Feed -->
        <div class="feed-header" id="feed">
            <span class="feed-title">
                <i class="bi bi-trophy-fill"></i> Publicaciones Recientes
            </span>
        </div>

        <!-- Tarjetas dinámicas -->
        <div th:each="pub : ${publicaciones}" class="fh-card">
            <div class="score-col">
                <span class="score-val" 
                      th:classappend="${pub.puntuacion > 0} ? 'pos' : (${pub.puntuacion < 0} ? 'neg' : 'neu')" 
                      th:text="${pub.puntuacion > 0} ? '+' + ${pub.puntuacion} : ${pub.puntuacion}">0</span>
                <span class="score-lbl">pts</span>
            </div>
            <div class="card-body-inner">
                <div class="card-meta">
                    <a th:href="@{/subforo/{id}(id=${pub.subforoId})}" class="badge-subforo" th:text="'f/ ' + ${pub.subforoNombre}">badge</a>
                </div>
                <div class="card-title">
                    <a th:href="@{/publicacion/{id}(id=${pub.id})}" th:text="${pub.titulo}">Título</a>
                </div>
                <p class="card-excerpt" th:text="${pub.descripcion}">
                    Descripción corta...
                </p>
                <div class="card-foot">
                    <span class="meta-pill"><i class="bi bi-person-circle"></i> <a th:href="@{/perfil/{nick}(nick=${pub.autorNickname})}" th:text="${pub.autorNickname}">Autor</a></span>
                    <span class="meta-pill"><i class="bi bi-clock"></i> <span th:text="${#temporals.format(pub.fechaCreacion, 'dd MMM yyyy HH:mm')}">Fecha</span></span>
                </div>
            </div>
        </div>
        <div th:if="${#lists.isEmpty(publicaciones)}" class="text-center py-5 text-muted">
            <i class="bi bi-chat-left-dots" style="font-size: 3rem;"></i>
            <p class="mt-3">No hay publicaciones disponibles todavía.</p>
        </div>

    </main>
</div><!-- /fh-layout -->

<!-- SCRIPTS desde base -->
<div th:replace="base :: scripts"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
