<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${title}">Nexo Foro</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>

    <!-- CSS personalizado del foro -->
    <link rel="stylesheet" th:href="@{/css/foro.css}" />
</head>

<body>

<!-- NAVBAR mejorado -->
<nav th:fragment="navbar" class="fh-navbar">
    <a th:href="@{/index}" class="fh-logo">
        <div class="fh-logo-icon">
            <i class="bi bi-chat-dots-fill"></i>
        </div>
        Nexo<span>Foro</span>
    </a>

    <!-- Barra de búsqueda -->
    <div class="fh-search d-none d-md-block">
        <div class="input-group">
            <input type="text" class="form-control" placeholder="Buscar en el foro..." aria-label="Buscar"/>
            <button class="btn" type="button">
                <i class="bi bi-search"></i>
            </button>
        </div>
    </div>

    <div class="nav-actions">
        <th:block th:if="${usuarioLogueado}">
            <span class="me-3 text-light">
                Hola, <a th:href="@{/perfil/{nick}(nick=${usuario.nickname})}" class="text-decoration-none fw-bold" style="color: var(--fh-accent-light);" th:text="${usuario.nickname}">User</a>
            </span>
            <a th:href="@{/admin}" th:if="${usuario.rol == 'admin'}" class="btn-login me-2" style="padding: 6px 12px; font-size: 0.85rem;">
                <i class="bi bi-shield-lock"></i> Admin
            </a>
            <a th:href="@{/logout}" class="btn-login" style="padding: 6px 12px; font-size: 0.85rem;">
                <i class="bi bi-box-arrow-right"></i> Salir
            </a>
        </th:block>
        <th:block th:unless="${usuarioLogueado}">
            <a th:href="@{/login}" class="btn-login">
                <i class="bi bi-box-arrow-in-right"></i> Iniciar Sesión
            </a>
            <a th:href="@{/registro}" class="btn-register">
                <i class="bi bi-person-plus"></i> Registro
            </a>
        </th:block>
    </div>
</nav>

<!-- SIDEBAR mejorado -->
<aside th:fragment="sidebar" class="fh-sidebar">
    <div class="sidebar-label">
        <i class="bi bi-list-ul me-1"></i> Navegación
    </div>
    <div class="sidebar-link-group">
        <a th:href="@{/index}" class="sub-link">
            <i class="bi bi-house-door-fill me-2"></i> Inicio
        </a>
        <a th:href="@{/tendencias}" class="sub-link">
            <i class="bi bi-fire me-2"></i> Tendencias
        </a>
    </div>

    <div class="sidebar-label mt-4">
        <i class="bi bi-grid-3x3-gap-fill me-1"></i> Subforos
    </div>

    <!-- Subforos Dinámicos -->
    <div th:each="sub : ${subforos}" th:if="${sub.parentId == null}" class="accordion-item">
        <button class="acc-btn" onclick="toggleAccordion(this)">
            <i class="bi bi-folder-fill me-1"></i> <span th:text="${sub.nombre}">Subforo</span>
            <i class="bi bi-chevron-down arrow"></i>
        </button>
        <div class="acc-body">
            <!-- Sub-subforos -->
            <a th:each="child : ${subforos}" th:if="${child.parentId == sub.id}" th:href="@{/subforo/{id}(id=${child.id})}" class="sub-link">
                <span class="dot"></span> <span th:text="${child.nombre}">Sub-subforo</span>
            </a>
            <a th:href="@{/subforo/{id}(id=${sub.id})}" class="sub-link text-muted">
                <span class="dot"></span> Ver todo f/<span th:text="${sub.nombre}">Subforo</span>
            </a>
        </div>
    </div>
    <div th:if="${#lists.isEmpty(subforos)}" class="px-3 py-2 text-muted" style="font-size:0.85rem;">
        No hay subforos disponibles.
    </div>
</aside>

<!-- SCRIPTS GLOBALES -->
<script th:fragment="scripts">
    // Función para el acordeón del sidebar
    function toggleAccordion(btn) {
        const body = btn.nextElementSibling;
        const isOpen = body.classList.contains('show');
        
        // Cerrar otros acordeones abiertos
        document.querySelectorAll('.acc-body.show').forEach(b => {
            if (b !== body) b.classList.remove('show');
        });
        document.querySelectorAll('.acc-btn.open').forEach(b => {
            if (b !== btn) b.classList.remove('open');
        });
        
        // Toggle el actual
        if (!isOpen) {
            body.classList.add('show');
            btn.classList.add('open');
        } else {
            body.classList.remove('show');
            btn.classList.remove('open');
        }
    }

    // Mantener compatibilidad con la función antigua si es necesario
    function toggleAcc(btn) {
        const content = btn.nextElementSibling;
        content.classList.toggle('d-none');
    }

    // Inicializar tooltips de Bootstrap si los usas
    document.addEventListener('DOMContentLoaded', function() {
        var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
        tooltipTriggerList.map(function(tooltipTriggerEl) {
            return new bootstrap.Tooltip(tooltipTriggerEl);
        });
    });
</script>
</body>
</html>
