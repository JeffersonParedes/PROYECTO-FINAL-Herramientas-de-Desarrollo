name: CI - Foro Backend

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: foro_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Esperar a que MySQL esté listo
        run: |
          until mysqladmin ping -h 127.0.0.1 -P 3306 -u root --silent; do
            echo "Esperando a MySQL..."
            sleep 3
          done

      - name: Dar permisos de ejecución a mvnw
        working-directory: ./app
        run: chmod +x mvnw

      - name: Ejecutar tests
        working-directory: ./app
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/foro_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: ""
        run: ./mvnw test

      - name: Compilar el proyecto (package)
        working-directory: ./app
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/foro_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: ""
        run: ./mvnw package -DskipTests

      - name: Subir el .jar como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: foro-app-jar
          path: app/target/*.jar